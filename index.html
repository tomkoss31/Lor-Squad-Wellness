<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- ─── SEO / Meta primaires ─────────────────────────────────── -->
    <title>La Base 360 — The wellness nutrition club</title>
    <!-- Pas de marque tierce dans les meta publiques : on ne peut pas ranker
         sur un nom de marque qu'on ne possède pas, et l'afficher en clair
         expose inutilement le club côté conformité. On cible ce qu'on peut
         réellement gagner : club nutrition / bilan / Verdun. -->
    <meta
      name="description"
      content="La Base 360 — The wellness nutrition club. Né d'un vrai club nutrition à Verdun depuis 2022. Bilan bien-être offert, suivi personnalisé et coaching nutrition."
    />
    <!-- <meta name="keywords"> volontairement retiré : ignoré par Google
         depuis 2009, aucun gain SEO, uniquement du signal exposé. -->
    <meta name="author" content="La Base 360" />
    <link rel="canonical" href="https://www.labase360.fr/" />

    <!-- ─── Open Graph (Facebook / WhatsApp / LinkedIn) ──────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Base 360" />
    <meta property="og:title" content="La Base 360 — The wellness nutrition club" />
    <meta property="og:description" content="L'app du coach nutrition moderne. Né d'un vrai club à Verdun depuis 2022." />
    <meta property="og:url" content="https://www.labase360.fr/" />
    <meta property="og:image" content="https://www.labase360.fr/brand/labase360/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La Base 360 — The wellness nutrition club" />
    <meta property="og:locale" content="fr_FR" />

    <!-- ─── Twitter Card ─────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="La Base 360" />
    <meta name="twitter:description" content="The wellness nutrition club. Bilan bien-être + suivi perso + coaching nutrition." />
    <meta name="twitter:image" content="https://www.labase360.fr/brand/labase360/og-image-1200x630.png" />

    <!-- ─── PWA / Mobile ─────────────────────────────────────────── -->
    <meta name="theme-color" content="#162624" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="La Base 360" />
    <meta name="msapplication-TileColor" content="#162624" />
    <meta name="msapplication-TileImage" content="/brand/labase360/pwa-192.png" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/brand/labase360/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/labase360/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/labase360/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/labase360/apple-touch-icon-180.png" />

    <!-- ─── Fonts ───────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Syne:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700&family=Cinzel:wght@500;600;700&family=Dancing+Script:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=JetBrains+Mono:wght@400;500;600&family=Anton&family=Archivo:wght@400;600;700;800;900&family=Archivo+Black&display=swap" rel="stylesheet">

    <!-- ─── JSON-LD ──────────────────────────────────────────────────
         Adresse = celle du LOCAL (11 rue Saint-Pierre), jamais le siège
         social, qui est le domicile du dirigeant et reste cantonné aux
         mentions légales. Elle doit rester identique au caractère près à la
         fiche Google Business : une adresse qui diverge casse le recoupement
         et pénalise le référencement local — c'est pire que pas d'adresse.
         Source de vérité : src/lib/branding.ts (CLUB_*).                -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "@id": "https://www.labase360.fr/#club",
        "name": "La Base 360",
        "alternateName": "La Base Verdun",
        "url": "https://www.labase360.fr",
        "logo": "https://www.labase360.fr/brand/labase360/logo-primary.svg",
        "image": "https://www.labase360.fr/brand/labase360/og-image-1200x630.png",
        "description": "The wellness nutrition club. Né d'un vrai club nutrition à Verdun depuis 2022. Bilan bien-être offert, suivi personnalisé et coaching nutrition.",
        "slogan": "The wellness nutrition club",
        "foundingDate": "2022",
        "email": "labaseverdun@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "11 rue Saint-Pierre",
          "postalCode": "55100",
          "addressLocality": "Verdun",
          "addressRegion": "Meuse",
          "addressCountry": "FR"
        },
        "areaServed": {
          "@type": "City",
          "name": "Verdun"
        }
      }
    </script>
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
