<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;background:var(--ls-bg)}
.main{flex:0 0 75%;display:flex;align-items:center;justify-content:center;padding:0 60px}
.mark{display:flex;flex-direction:column;align-items:center;gap:34px}
.mark svg{width:260px;height:260px}
.name{font-family:var(--font-title);color:var(--ls-text);font-size:96px;letter-spacing:.01em;text-transform:uppercase;line-height:.92;text-align:center}
.strip{flex:1;display:flex;flex-direction:column}
.strip>div{flex:1}
</style></head><body>
<div class="tile">
  <div class="main">
    <div class="mark">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="La Base 360">
        <path d="M 176.3 71.6 A 80 80 0 1 1 128.3 23.6" fill="none" stroke="#2DD4BF" stroke-width="13" stroke-linecap="round"></path>
        <rect x="-24" y="-6.5" width="48" height="13" rx="6.5" fill="#C5F82A" transform="translate(159 41) rotate(-45)"></rect>
        <path fill-rule="evenodd" fill="#FFFFFF" d="M 66 52 L 111 52 C 131 52 144 63.5 144 77 C 144 88 137 95.5 127 99.5 C 139.5 103 149 112.5 149 126 C 149 140.5 135 151 113 151 L 66 151 Z M 87 70 L 87 91 L 109 91 C 118.5 91 124 86.5 124 80.5 C 124 74.5 118.5 70 109 70 Z M 87 110 L 87 133 L 112 133 C 122 133 128 128 128 121.5 C 128 115 122 110 112 110 Z"></path>
      </svg>
      <div class="name">LA BASE<br>360</div>
    </div>
  </div>
  <div class="strip">
    <div style="background:#C5F82A"></div>
    <div style="background:#2DD4BF"></div>
    <div style="background:#E8A93A"></div>
    <div style="background:#F2775F"></div>
  </div>
</div>
</body></html>
