<!-- @dsCard group="Colors" viewport="700x180" name="Breakfast Club · accents" subtitle="Warm CTA gradient + secondary accents" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-bc-body);background:var(--bc-cream);padding:20px}
.row{display:flex;gap:12px;margin-bottom:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:48px;border-radius:12px}
.n{font-size:11px;font-weight:600;color:var(--bc-ink)}
.h{color:#8A938D;font-family:var(--font-mono);font-size:10px}
.cta{height:48px;border-radius:999px;background:linear-gradient(135deg,#FF7A2F,#FF1E3C);box-shadow:0 16px 34px -14px rgba(255,45,60,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#FF6A2B"></div><div class="n">Orange</div><div class="h">#FF6A2B</div></div>
<div class="sw"><div class="chip" style="background:#F5178F"></div><div class="n">Pink</div><div class="h">#F5178F</div></div>
<div class="sw"><div class="chip" style="background:#F1E27E"></div><div class="n">Yellow</div><div class="h">#F1E27E</div></div>
<div class="sw"><div class="chip" style="background:#93A67E"></div><div class="n">Sage</div><div class="h">#93A67E</div></div>
<div class="sw"><div class="chip" style="background:#F6C6A0"></div><div class="n">Peach</div><div class="h">#F6C6A0</div></div>
<div class="sw"><div class="chip" style="background:#E5352B"></div><div class="n">Heart</div><div class="h">#E5352B</div></div>
</div>
<div class="cta">CTA gradient · #FF7A2F → #FF1E3C</div>
</body></html>
