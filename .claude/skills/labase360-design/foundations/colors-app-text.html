<!-- @dsCard group="Colors" viewport="700x150" name="App · dark text" subtitle="Warm-white ink at three emphasis levels" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-body);background:var(--ls-bg);padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:baseline;gap:16px}
.big{font-size:22px}.mut{font-size:22px}.hint{font-size:22px}
.big{color:var(--ls-text)}.mut{color:var(--ls-text-muted)}.hint{color:var(--ls-text-hint)}
.tok{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ls-text-hint)}
</style></head><body>
<div class="line"><span class="big">Texte principal</span><span class="tok">--ls-text · #F4EFE4</span></div>
<div class="line"><span class="mut">Texte atténué</span><span class="tok">--ls-text-muted · #9BAAA3</span></div>
<div class="line"><span class="hint">Texte discret</span><span class="tok">--ls-text-hint · #74847C</span></div>
</body></html>
