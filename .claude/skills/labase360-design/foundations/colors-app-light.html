<!-- @dsCard group="Colors" viewport="700x180" name="App · light mode" subtitle="Cream ground, green ink, darkened accents — not an inversion" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-body);background:var(--ls-l-bg);padding:20px}
.grp{display:flex;gap:12px;margin-bottom:12px}
.sw{flex:1;height:44px;border-radius:var(--ls-radius);border:1px solid var(--ls-l-border);display:flex;align-items:center;padding:0 12px}
.lbl{font-size:12px;font-weight:600}
.h{margin-left:auto;font-family:var(--font-mono);font-size:10px;opacity:.6}
.chip{flex:1;height:40px;border-radius:var(--ls-radius);display:flex;align-items:flex-end;padding:6px;color:#fff;font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="grp">
<div class="sw" style="background:#FAF7F0;color:#17201C"><span class="lbl">Page</span><span class="h">#FAF7F0</span></div>
<div class="sw" style="background:#FFFFFF;color:#17201C"><span class="lbl">Surface</span><span class="h">#FFFFFF</span></div>
<div class="sw" style="background:#F5F1EB;color:#17201C"><span class="lbl">Surface 2</span><span class="h">#F5F1EB</span></div>
<div class="sw" style="background:#17201C;color:#FAF7F0;border:none"><span class="lbl">Ink</span><span class="h">#17201C</span></div>
</div>
<div class="grp">
<div class="chip" style="background:#0D9488">teal #0D9488</div>
<div class="chip" style="background:#6D8C0B">lime→olive #6D8C0B</div>
<div class="chip" style="background:#D9553C">coral #D9553C</div>
<div class="chip" style="background:#5F7154">sage #5F7154</div>
<div class="chip" style="background:#B7791F">amber #B7791F</div>
<div class="chip" style="background:#6D28D9">purple #6D28D9</div>
</div>
</body></html>
