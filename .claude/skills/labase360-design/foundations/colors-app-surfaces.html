<!-- @dsCard group="Colors" viewport="700x150" name="App · dark surfaces" subtitle="Deep-green ground and surface steps — never black" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-body);background:var(--ls-bg);padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;height:104px;border-radius:var(--ls-radius);border:1px solid var(--ls-border);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.n{color:var(--ls-text);font-size:13px;font-weight:600}
.h{color:var(--ls-text-muted);font-family:var(--font-mono);font-size:11px;margin-top:2px}
.t{color:var(--ls-text-hint);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em}
</style></head><body><div class="row">
<div class="sw" style="background:#162624"><div class="t">--ls-bg</div><div class="n">Page</div><div class="h">#162624</div></div>
<div class="sw" style="background:#1E3330"><div class="t">--ls-surface</div><div class="n">Surface</div><div class="h">#1E3330</div></div>
<div class="sw" style="background:#26403B"><div class="t">--ls-surface2</div><div class="n">Field</div><div class="h">#26403B</div></div>
<div class="sw" style="background:#2E4A44"><div class="t">step</div><div class="n">Surface 3</div><div class="h">#2E4A44</div></div>
</div></body></html>
