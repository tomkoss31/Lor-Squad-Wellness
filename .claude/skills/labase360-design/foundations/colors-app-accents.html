<!-- @dsCard group="Colors" viewport="700x170" name="App · accents" subtitle="Each accent carries a fixed meaning — lime = wins only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-body);background:var(--ls-bg);padding:20px}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:56px;border-radius:var(--ls-radius)}
.n{color:var(--ls-text);font-size:12px;font-weight:600}
.m{color:var(--ls-text-muted);font-size:11px}
.h{color:var(--ls-text-hint);font-family:var(--font-mono);font-size:10px}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#2DD4BF"></div><div class="n">Teal</div><div class="m">structure</div><div class="h">#2DD4BF</div></div>
<div class="sw"><div class="chip" style="background:#C5F82A"></div><div class="n">Lime</div><div class="m">wins only</div><div class="h">#C5F82A</div></div>
<div class="sw"><div class="chip" style="background:#F2775F"></div><div class="n">Coral</div><div class="m">urgency</div><div class="h">#F2775F</div></div>
<div class="sw"><div class="chip" style="background:#93A67E"></div><div class="n">Sage</div><div class="m">calm</div><div class="h">#93A67E</div></div>
<div class="sw"><div class="chip" style="background:#E8A93A"></div><div class="n">Amber</div><div class="m">attention</div><div class="h">#E8A93A</div></div>
<div class="sw"><div class="chip" style="background:#A78BFA"></div><div class="n">Purple</div><div class="m">XP</div><div class="h">#A78BFA</div></div>
</div></body></html>
