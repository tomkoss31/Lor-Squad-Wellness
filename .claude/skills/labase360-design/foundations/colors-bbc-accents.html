<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-bbc-body);background:var(--ls-bbc-bg);padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:var(--ls-radius)}
.n{color:var(--ls-bbc-text);font-size:13px;font-weight:600}
.m{color:var(--ls-bbc-text-muted);font-size:11px}
.h{color:var(--ls-bbc-text-muted);font-family:var(--font-mono);font-size:10px;opacity:.7}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#C5F82A"></div><div class="n">Lime</div><div class="m">the club</div><div class="h">#C5F82A</div></div>
<div class="sw"><div class="chip" style="background:#2DD4BF"></div><div class="n">Teal</div><div class="m">a member</div><div class="h">#2DD4BF</div></div>
<div class="sw"><div class="chip" style="background:#F2775F"></div><div class="n">Coral</div><div class="m">urgent</div><div class="h">#F2775F</div></div>
<div class="sw"><div class="chip" style="background:#E8A93A"></div><div class="n">Amber</div><div class="m">silence</div><div class="h">#E8A93A</div></div>
<div class="sw"><div class="chip" style="background:#A78BFA"></div><div class="n">Purple</div><div class="m">a ritual</div><div class="h">#A78BFA</div></div>
</div></body></html>
