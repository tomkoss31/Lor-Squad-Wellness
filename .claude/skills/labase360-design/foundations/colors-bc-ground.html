<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-bc-body);background:var(--bc-cream);padding:20px}
.row{display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:12px;border:1px solid rgba(30,51,48,.08)}
.n{font-size:12px;font-weight:600;color:var(--bc-ink)}
.h{color:#8A938D;font-family:var(--font-mono);font-size:10px}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#FCF8F1"></div><div class="n">Cream</div><div class="h">#FCF8F1</div></div>
<div class="sw"><div class="chip" style="background:#F0E7D7"></div><div class="n">Cream alt</div><div class="h">#F0E7D7</div></div>
<div class="sw"><div class="chip" style="background:#1E3330"></div><div class="n">Green band</div><div class="h">#1E3330</div></div>
<div class="sw"><div class="chip" style="background:#26403B"></div><div class="n">Dark card</div><div class="h">#26403B</div></div>
<div class="sw"><div class="chip" style="background:#162624"></div><div class="n">Footer</div><div class="h">#162624</div></div>
<div class="sw"><div class="chip" style="background:#17201C"></div><div class="n">Ink</div><div class="h">#17201C</div></div>
</div></body></html>
