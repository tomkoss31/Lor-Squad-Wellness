name: Sauvegarde Supabase
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Lancer la sauvegarde
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backup

      - name: Archiver les backups (artefact GitHub, hors git)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error

      # Le script sort en code 1 dès qu'une table échoue. Sans cette étape, un
      # échec ne produisait AUCUN signal : le récap du dimanche ne tournait pas,
      # et personne ne remarquait le silence. C'est ce qui a permis à
      # `activity_logs` (table supprimée) d'échouer pendant des mois sous un
      # « ✅ Sauvegarde OK ».
      - name: ⚠️ Sauvegarde en échec → alerte immédiate
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ SAUVEGARDE ÉCHOUÉE — $(date -u +%Y-%m-%d)" \
            --body "La sauvegarde quotidienne a échoué. **Tes données du jour ne sont pas archivées.**

          👉 [Voir le détail de l'erreur](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Le script liste la table fautive dans son journal et dans \`manifest.json\`.
          Tant que ce n'est pas corrigé, la dernière sauvegarde valable est celle d'hier."

      - name: Récap hebdo (dimanche) → crée une issue GitHub
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ne s'exécute que le dimanche (jour 7)
          if [ "$(date -u +%u)" = "7" ]; then
            DATE=$(date -u +%Y-%m-%d)
            MANIFEST="backups/$DATE/manifest.json"
            if [ -f "$MANIFEST" ]; then
              TOTAL=$(jq -r '.total' "$MANIFEST")
              NB=$(jq -r '.tables | length' "$MANIFEST")
              # Seules les tables non vides sont détaillées : sur 117 ensembles,
              # la liste complète était devenue illisible.
              DETAILS=$(jq -r '.tables | to_entries | map(select(.value > 0)) | sort_by(-.value) | map("- **\(.key)** : \(.value)") | join("\n")' "$MANIFEST")
              gh issue create \
                --title "📊 Récap backup La Base 360 — $DATE" \
                --body "## ✅ Sauvegarde hebdomadaire OK

          **$TOTAL enregistrements sur $NB ensembles** (tables + comptes de connexion + inventaire du stockage).

          $DETAILS

          ---

          📂 Sauvegardes archivées en artefact GitHub Actions (90j) — onglet **Actions** → ce run → section *Artifacts*.
          📖 [Guide de restauration](../blob/main/docs/BACKUPS.md)

          Si tu reçois cet email, ta sauvegarde tourne normalement. ✨"
            fi
          fi
